<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="Vintage specs">
<title>Vintage cocktail specs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=Figtree:wght@400;500;600&family=Limelight&family=Josefin+Sans:wght@400;600;700&family=Bebas+Neue&family=Special+Elite&family=Poiret+One&family=Yellowtail&display=swap" rel="stylesheet">
<style id="appstyle">
:root{
  --bg:#E4E9E3; --surface:#F5F7F2; --ink:#1B2420; --muted:#5A6660; --brass:#8F6420; --brass-ink:#fff;
  --line:#C7CFC6; --field:#fff; --glass-fill:rgba(255,255,255,.6); --glass-line:#83918A; --shine:rgba(255,255,255,.9); --danger:#A3302A;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111714; --surface:#1A221E; --ink:#E4E9E2; --muted:#98A49D; --brass:#D4A452; --brass-ink:#1A1408;
    --line:#2C3732; --field:#111714; --glass-fill:rgba(255,255,255,.06); --glass-line:#7C8B84; --shine:rgba(255,255,255,.35); --danger:#E07A70;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111714; --surface:#1A221E; --ink:#E4E9E2; --muted:#98A49D; --brass:#D4A452; --brass-ink:#1A1408;
  --line:#2C3732; --field:#111714; --glass-fill:rgba(255,255,255,.06); --glass-line:#7C8B84; --shine:rgba(255,255,255,.35); --danger:#E07A70;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 130px);scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:880px;margin:0 auto;padding:0 20px}
header{padding:36px 0 8px}
h1{font-family:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;font-weight:700;font-size:clamp(2.3rem,8vw,4rem);line-height:1;margin:0 0 12px;letter-spacing:-.01em}
.lede{color:var(--muted);max-width:52ch;margin:0}
.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px}
.search{flex:1 1 200px;min-width:0;font:inherit;padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;order:2;flex:1 1 100%;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
#add{order:1;flex:none}
.chip{flex:none;white-space:nowrap;font:inherit;font-size:.9rem;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{font:inherit;font-weight:600;padding:10px 16px;border-radius:999px;border:1px solid var(--brass);background:var(--brass);color:var(--brass-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--brass)}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn:disabled{opacity:.55;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.status{min-height:1.5em;color:var(--muted);font-size:.9rem;margin:4px 0 0}

.barline{margin:16px -20px 0;padding:0 20px 6px;overflow-x:auto;scrollbar-width:thin}
.barline ol{list-style:none;margin:0;padding:0;display:flex;gap:4px;align-items:flex-end;min-width:max-content;border-bottom:3px solid var(--brass)}
.barline a{display:flex;flex-direction:column;align-items:center;width:74px;text-decoration:none;color:var(--muted);font-size:.75rem;line-height:1.2;text-align:center;padding:0 2px 8px;border-radius:6px}
.barline a svg{width:64px;height:auto;display:block;margin-bottom:6px}
.barline a:hover{color:var(--ink)}

h2{font-family:"Bodoni Moda","Didot",Georgia,serif;font-weight:500;font-size:1.9rem;margin:44px 0 16px}
.drink{display:grid;grid-template-columns:132px 1fr;gap:22px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px;position:relative}
.drink figure{margin:0}
.drink figure svg,.drink figure img{width:100%;height:auto;display:block}
.drink figure img{border-radius:10px;aspect-ratio:3/4;object-fit:cover}
.drink h3{font-family:"Bodoni Moda","Didot",Georgia,serif;font-weight:700;font-size:1.6rem;line-height:1.1;margin:0;padding-right:56px}
.aka{color:var(--muted);font-size:.85rem;margin:4px 0 0}
.look{margin:10px 0 14px;font-size:.95rem}
table{border-collapse:collapse;width:100%;max-width:380px;font-size:.95rem}
td{padding:5px 0;border-bottom:1px dashed var(--line);vertical-align:top}
td:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--brass);font-weight:600;padding-left:12px;white-space:nowrap}
tr:last-child td{border-bottom:0}
dl{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:14px 0 0;font-size:.9rem}
dt{color:var(--muted)} dd{margin:0}
.note{margin:12px 0 0;font-size:.85rem;color:var(--muted);border-left:3px solid var(--brass);padding-left:10px}
.prep{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;position:relative;font-size:.92rem;line-height:1.45}
.prep.guide{border:2px solid var(--brass);padding:14px 16px;margin-bottom:16px}
.prep-head{display:flex;align-items:center;gap:8px;padding-right:58px}
.prep h3{font-family:"Bodoni Moda","Didot",Georgia,serif;font-weight:700;font-size:1.15rem;line-height:1.2;margin:0}
.prep.guide h3{font-size:1.35rem}
.dot{width:12px;height:12px;border-radius:50%;flex:none;border:1px solid var(--glass-line)}
.guide .dot{display:none}
.bx{margin-left:auto;font-size:.75rem;color:var(--brass);font-weight:600;white-space:nowrap}
.prep-ing{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:2px 14px}
.guide .prep-ing{display:block}.guide .prep-ing li{margin:3px 0}
.prep-ing .q{font-weight:600;color:var(--brass);font-variant-numeric:tabular-nums}
.steps{margin:8px 0 0;padding-left:1.3em}.steps li{margin:3px 0}
.prep-look{margin:6px 0 0;font-weight:500}
.prep-how{margin:6px 0 0}
.prep-note{margin:6px 0 0;font-size:.82rem;color:var(--muted)}
.prep-meta{margin:6px 0 0;font-size:.8rem;color:var(--muted)}.prep-meta a{color:var(--brass)}
.prep .edit{top:10px;right:10px;padding:3px 10px;font-size:.8rem}
.lesson{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 18px 14px;margin-bottom:14px;font-size:.95rem;line-height:1.55}
.lesson h3{font-family:"Bodoni Moda","Didot",Georgia,serif;font-weight:700;font-size:1.45rem;line-height:1.15;margin:0}
.lesson h4{font-size:1rem;margin:16px 0 2px}
.lesson p{margin:8px 0 0}
.lesson-intro{font-size:1.02rem;font-weight:500}
.lesson .tip{border-left:3px solid var(--brass);padding-left:10px;color:var(--ink);font-style:italic}
.tw{overflow-x:auto;margin:10px 0 0}
table.lt{max-width:none;width:100%;border-collapse:collapse;font-size:.88rem}
table.lt th{text-align:left;font-weight:600;color:var(--muted);padding:6px 10px 6px 0;border-bottom:1px solid var(--line);white-space:nowrap}
table.lt td{text-align:left;color:var(--ink);font-weight:400;white-space:normal;padding:6px 10px 6px 0;border-bottom:1px dashed var(--line)}
table.lt td:first-child{font-weight:600}
table.lt a{color:var(--brass)}
.prep-link{color:inherit;text-decoration:underline;text-decoration-style:dotted;text-decoration-color:var(--brass);text-underline-offset:3px}
.uses{font-size:.85rem;color:var(--muted);margin:12px 0 0}.uses a{color:var(--brass)}
.menu-head{font-family:"Bodoni Moda","Didot",Georgia,serif;font-weight:500;font-size:1.3rem;color:var(--brass);margin:28px 0 12px}
.edit{position:absolute;top:16px;right:16px;font:inherit;font-size:.85rem;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.empty{color:var(--muted);padding:24px 0}
footer{color:var(--muted);font-size:.85rem;padding:24px 0 48px}
@media (max-width:540px){
  .drink{grid-template-columns:92px 1fr;gap:14px;padding:16px}
  .drink h3{font-size:1.35rem}
}

/* editor */
dialog{width:min(640px,100vw);max-height:100%;margin:auto;padding:0;border:0;border-radius:16px;background:var(--surface);color:var(--ink)}
@media (max-width:640px){dialog{border-radius:0;height:100%;max-width:100vw}}
dialog::backdrop{background:rgba(10,14,12,.55)}
.ed{padding:calc(env(safe-area-inset-top,0px) + 20px) 20px calc(env(safe-area-inset-bottom,0px) + 20px)}
.ed-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.ed-head h2{margin:0;font-size:1.6rem}
.ed-preview{display:flex;gap:16px;align-items:center;margin:14px 0}
.ed-preview svg{width:96px;flex:none}
.ed-preview p{margin:0;color:var(--muted);font-size:.9rem}
fieldset{border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 14px}
legend{padding:0 6px;font-weight:600}
label{display:block;font-size:.9rem;color:var(--muted);margin:0 0 10px}
label > input:not([type=checkbox]):not([type=color]),label > select,label > textarea,.ing input{display:block;width:100%;margin-top:4px;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{resize:vertical;min-height:64px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px}
.checks label{display:flex;gap:6px;align-items:center;margin:0;color:var(--ink)}
.colors{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.colors label{display:flex;gap:8px;align-items:center;margin:0;color:var(--ink)}
input[type=color]{width:44px;height:32px;border:1px solid var(--line);border-radius:6px;background:none;padding:2px}
.ing{display:grid;grid-template-columns:1fr 110px 36px;gap:6px;margin-bottom:6px}
.ing input{margin:0}
.x{font:inherit;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;cursor:pointer}
.ed-actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:6px}
.ed-actions div{display:flex;gap:8px}
.hint{font-size:.85rem;color:var(--muted);margin:0 0 8px}

/* ---------- 1920s Art Deco look ---------- */
:root{
  --bg:#F1E8D2; --surface:#FBF6EA; --ink:#14110C; --muted:#5E5444; --brass:#86621A; --brass-ink:#FBF6EA;
  --line:#CDBB8E; --field:#FFFDF7; --glass-fill:rgba(255,255,255,.55); --glass-line:#6B5E45; --danger:#9A2B22;
  --deco-head:"Limelight","Bodoni Moda",Georgia,serif; --deco-caps:"Josefin Sans","Figtree",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D0C0A; --surface:#17150F; --ink:#EFE6CF; --muted:#A99D82; --brass:#D4AF5A; --brass-ink:#14110C;
    --line:#3A3222; --field:#0D0C0A; --glass-fill:rgba(255,255,255,.06); --glass-line:#A08F68; --danger:#E07A70;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0C0A; --surface:#17150F; --ink:#EFE6CF; --muted:#A99D82; --brass:#D4AF5A; --brass-ink:#14110C;
  --line:#3A3222; --field:#0D0C0A; --glass-fill:rgba(255,255,255,.06); --glass-line:#A08F68; --danger:#E07A70;
}

/* header: sunburst fan, deco title, double rule */
header{text-align:center;padding-top:28px}
header::before{content:"";display:block;width:200px;height:56px;margin:0 auto 14px;
  background:radial-gradient(circle at 50% 100%,var(--brass) 0 13px,transparent 14px),
             repeating-conic-gradient(from 270deg at 50% 100%,var(--brass) 0deg 1.6deg,transparent 1.6deg 9deg);
  -webkit-mask:radial-gradient(circle at 50% 100%,#000 0 56px,transparent 57px);
          mask:radial-gradient(circle at 50% 100%,#000 0 56px,transparent 57px)}
header::after{content:"";display:block;width:min(320px,80%);height:9px;margin:20px auto 0;
  border-top:1px solid var(--brass);border-bottom:1px solid var(--brass);
  background:linear-gradient(var(--brass),var(--brass)) center/26% 3px no-repeat}
h1{font-family:var(--deco-head);font-weight:400;text-transform:uppercase;letter-spacing:.05em;font-size:clamp(2rem,7vw,3.6rem);line-height:1.08}
.lede{margin:0 auto;font-style:italic}

/* controls: squared, small caps, gold */
.search{border-radius:0;border:1px solid var(--line);border-bottom:2px solid var(--brass)}
.chip,.btn,.edit{border-radius:0;font-family:var(--deco-caps);text-transform:uppercase;letter-spacing:.1em;font-size:.76rem;padding-top:8px}
.chip{border-color:var(--brass)}
.chip[aria-pressed="true"]{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
.barline ol{border-bottom:5px double var(--brass)}
.barline a{font-family:var(--deco-caps);letter-spacing:.03em}

/* section headings flanked by double rules */
#list h2{display:flex;align-items:center;gap:16px;text-align:center;font-family:var(--deco-head);font-weight:400;
  text-transform:uppercase;letter-spacing:.08em;font-size:clamp(1.25rem,4.5vw,1.7rem);margin:52px 0 20px}
#list h2::before,#list h2::after{content:"";flex:1;height:5px;border-top:1px solid var(--brass);border-bottom:1px solid var(--brass)}
.menu-head{font-family:var(--deco-caps);font-weight:600;text-transform:uppercase;letter-spacing:.2em;font-size:.95rem;text-align:center}

/* cards: square corners with an inset gold frame */
.drink,.lesson,.prep{border-radius:2px;border-color:var(--brass)}
.drink{padding:24px}
.drink::before,.lesson::before{content:"";position:absolute;inset:5px;border:1px solid var(--brass);opacity:.45;pointer-events:none}
.drink h3{font-family:var(--deco-caps);font-weight:700;text-transform:uppercase;letter-spacing:.07em;font-size:1.3rem;line-height:1.2}
.prep h3,.lesson h3{font-family:var(--deco-caps);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.lesson h4{font-family:var(--deco-caps);text-transform:uppercase;letter-spacing:.08em;font-size:.9rem}
dt{font-family:var(--deco-caps);text-transform:uppercase;letter-spacing:.08em;font-size:.78rem;padding-top:2px}
.dot{border-radius:0;transform:rotate(45deg);width:10px;height:10px}

footer{text-align:center;border-top:5px double var(--brass);margin-top:40px;font-family:var(--deco-caps);letter-spacing:.06em}
dialog{border-radius:2px}
@media (max-width:540px){ .drink{padding:18px} .drink h3{font-size:1.1rem} }

/* ---------- Chicago speakeasy / big band layer (1920s–40s) ---------- */
:root{
  --bg:#EDE2C8; --surface:#FAF3E2; --ink:#17110D; --muted:#5B4C3C; --brass:#8A621B; --brass-ink:#FAF3E2;
  --line:#CBB68E; --red:#8E1B20; --red-ink:#FAF3E2; --stripe:rgba(23,17,13,.045);
  --marquee:#17100D; --marquee-ink:#F4E7C8; --bulb:#FFE3A0; --card-paper:#F7EFDB; --card-ink:#2A211A;
  --big:"Bebas Neue","Oswald",Impact,sans-serif; --type:"Special Elite","Courier New",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E0B0A; --surface:#1B1411; --ink:#F1E6D0; --muted:#B3A48A; --brass:#D9AE55; --brass-ink:#140E0B;
    --line:#3B2B22; --red:#D2453F; --red-ink:#140E0B; --stripe:rgba(241,230,208,.035);
    --marquee:#1B1210; --marquee-ink:#F4E7C8;
  }
}
:root[data-theme="dark"]{
  --bg:#0E0B0A; --surface:#1B1411; --ink:#F1E6D0; --muted:#B3A48A; --brass:#D9AE55; --brass-ink:#140E0B;
  --line:#3B2B22; --red:#D2453F; --red-ink:#140E0B; --stripe:rgba(241,230,208,.035);
  --marquee:#1B1210; --marquee-ink:#F4E7C8;
}

/* pinstripe suit cloth behind everything */
body{background:repeating-linear-gradient(90deg,transparent 0 13px,var(--stripe) 13px 14px),var(--bg);background-attachment:fixed}
.tools{background:var(--bg)}

/* the header becomes a lit theatre marquee */
header{position:relative;margin-top:22px;padding:30px 26px 30px;background:var(--marquee);color:var(--marquee-ink);
  border:2px solid var(--brass);box-shadow:0 0 0 5px var(--marquee),0 0 0 6px var(--brass),0 14px 40px rgba(0,0,0,.35)}
header::before{width:180px;height:48px;margin-bottom:10px;
  background:radial-gradient(circle at 50% 100%,#E8BE62 0 12px,transparent 13px),
             repeating-conic-gradient(from 270deg at 50% 100%,#E8BE62 0deg 1.6deg,transparent 1.6deg 9deg);
  -webkit-mask:radial-gradient(circle at 50% 100%,#000 0 48px,transparent 49px);
          mask:radial-gradient(circle at 50% 100%,#000 0 48px,transparent 49px)}
@property --ba{syntax:'<color>';inherits:false;initial-value:#FFE7A6}
@property --bb{syntax:'<color>';inherits:false;initial-value:#FFE7A6}
header::after{content:"";position:absolute;inset:5px;width:auto;height:auto;margin:0;border:0;pointer-events:none;padding:18px;
  --ba:#FFE7A6;--bb:#FFE7A6;
  background:
    radial-gradient(circle at 9px 9px,#FFF8E6 0 1.4px,var(--ba) 2.2px 3.9px,color-mix(in srgb,var(--ba) 40%,transparent) 5.2px,transparent 8px) 0 0/36px 36px round,
    radial-gradient(circle at 27px 27px,#FFF8E6 0 1.4px,var(--ba) 2.2px 3.9px,color-mix(in srgb,var(--ba) 40%,transparent) 5.2px,transparent 8px) 0 0/36px 36px round,
    radial-gradient(circle at 27px 9px,#FFF8E6 0 1.4px,var(--bb) 2.2px 3.9px,color-mix(in srgb,var(--bb) 40%,transparent) 5.2px,transparent 8px) 0 0/36px 36px round,
    radial-gradient(circle at 9px 27px,#FFF8E6 0 1.4px,var(--bb) 2.2px 3.9px,color-mix(in srgb,var(--bb) 40%,transparent) 5.2px,transparent 8px) 0 0/36px 36px round;
  animation:marquee-chase .6s infinite}
@keyframes marquee-chase{
  0%,49.9%{--ba:#FFE7A6;--bb:#5E3F1C}
  50%,100%{--ba:#5E3F1C;--bb:#FFE7A6}
}
@media (prefers-reduced-motion:reduce){ header::after{animation-duration:2s} }
header::after{
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
          mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
h1{font-family:var(--big);font-weight:400;letter-spacing:.06em;font-size:clamp(2.6rem,10vw,5rem);line-height:.95;color:var(--marquee-ink);
  text-shadow:0 0 18px rgba(255,200,100,.35),0 2px 0 #000}
h1::before{content:"★ ★ ★";display:block;font-size:.28em;letter-spacing:.7em;color:#E8BE62;margin-bottom:8px;text-shadow:none}
header .lede{color:#CDBE9F;font-family:var(--type);font-style:normal;font-size:.92rem}

/* poster-style section headings */
#list h2{font-family:var(--big);font-size:clamp(1.9rem,6vw,2.5rem);letter-spacing:.07em;color:var(--red);gap:14px}
.menu-head{font-family:var(--type);font-weight:400;letter-spacing:.12em;color:var(--brass)}

/* chips and buttons like ticket stubs */
.chip,.btn,.edit{font-family:var(--big);font-size:1.02rem;letter-spacing:.09em;padding:6px 14px 4px}
.chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.search{font-family:var(--type)}

/* recipe cards: big-band billing names, typewritten case-file details */
.drink h3{font-family:var(--big);font-weight:400;font-size:2rem;letter-spacing:.06em;line-height:1}
.prep h3,.lesson h3{font-family:var(--big);font-weight:400;font-size:1.5rem;letter-spacing:.06em}
.aka,dt,.prep-meta,.bx{font-family:var(--type);letter-spacing:.04em}
dt{text-transform:none;font-size:.82rem}
.barline a{font-family:var(--type);letter-spacing:0}
.note{font-family:var(--type);color:var(--card-ink);font-size:.84rem;line-height:1.55;border-left:0;padding:10px 14px 10px 36px;margin-top:16px;
  background:linear-gradient(90deg,transparent 26px,rgba(178,40,45,.55) 26px 27px,transparent 27px),
             repeating-linear-gradient(180deg,transparent 0 23px,rgba(70,110,160,.18) 23px 24px),var(--card-paper);
  box-shadow:0 2px 6px rgba(0,0,0,.25);transform:rotate(-.4deg)}
footer{font-family:var(--type);letter-spacing:.02em}
@media (max-width:540px){ .drink h3{font-size:1.6rem} header{padding:34px 30px} }
/* keep each card's inset frame inside its own card */
.lesson{position:relative}
/* sticky search bar spans the side gutters so the drink strip can't slide past it */
.tools{margin-left:-20px;margin-right:-20px;padding-left:20px;padding-right:20px}

/* ---------- Vintage Nightlife logo and matching type ---------- */
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
header::before{width:150px;height:40px;margin-bottom:6px;
  -webkit-mask:radial-gradient(circle at 50% 100%,#000 0 40px,transparent 41px);
          mask:radial-gradient(circle at 50% 100%,#000 0 40px,transparent 41px)}
h1{margin:0 0 12px;line-height:1;text-shadow:none;font-size:1rem;letter-spacing:0}
h1::before{content:none}
h1 .logo{display:block;width:min(420px,84%);height:auto;margin:0 auto;color:#E8BE62;
  filter:drop-shadow(0 0 12px rgba(255,196,90,.35)) drop-shadow(0 2px 0 rgba(0,0,0,.85))}
h1 .subtitle{display:flex;align-items:center;justify-content:center;gap:.7em;margin-top:16px;
  font-family:"Poiret One","Josefin Sans",sans-serif;font-weight:400;-webkit-text-stroke:.4px currentColor;
  font-size:clamp(1.05rem,3.8vw,1.55rem);letter-spacing:.3em;text-indent:.3em;color:var(--marquee-ink)}
h1 .subtitle::before,h1 .subtitle::after{content:"★";font-size:.55em;color:#E8BE62;letter-spacing:0;-webkit-text-stroke:0}
/* the logo's two faces carry through the page: deco caps for sections, script for drink names */
#list h2{font-family:"Poiret One","Josefin Sans",sans-serif;font-weight:400;-webkit-text-stroke:.7px currentColor;
  letter-spacing:.2em;font-size:clamp(1.45rem,5vw,2.05rem)}
.drink h3{font-family:"Yellowtail",cursive;font-weight:400;text-transform:none;letter-spacing:.01em;font-size:2.3rem;line-height:1.05;color:var(--brass)}
.drink > div{min-width:0}
.drink h3{overflow-wrap:anywhere}
@media (max-width:540px){
  .drink h3{font-size:1.85rem} h1 .logo{width:92%}
  #list h2{letter-spacing:.1em;font-size:1.3rem;gap:10px}
}

/* ---------- staff site: login, tabs, options, checklists, manage ---------- */
.tabs{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0 4px;border-bottom:5px double var(--brass);padding-bottom:10px}
.tab-row{display:flex;gap:6px;flex-wrap:wrap}
.tab{font-family:var(--big);font-size:1.15rem;letter-spacing:.08em;padding:7px 16px 5px;border:1px solid var(--brass);background:transparent;color:var(--ink);cursor:pointer}
.tab[aria-current="page"]{background:var(--brass);color:var(--brass-ink)}
.who{display:flex;align-items:center;gap:10px;font-family:var(--type);font-size:.85rem;color:var(--muted)}
.langs{display:inline-flex;border:1px solid var(--line)}
.langs button{font:inherit;font-size:.78rem;padding:4px 8px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.linkish{font:inherit;background:none;border:0;padding:4px 2px;color:var(--brass);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.danger-text{color:var(--danger)}
.opts{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:4px 0 6px;font-family:var(--type);font-size:.85rem;color:var(--muted)}
.opts label{display:flex;align-items:center;gap:8px;margin:0;color:var(--muted)}
.opts select,.opts input{font:inherit;font-family:var(--type);color:var(--ink);background:var(--field);border:1px solid var(--line);padding:6px 8px;border-radius:0}
.opts .batch input{width:68px}
.seg{display:inline-flex;border:1px solid var(--brass)}
.seg button{font-family:var(--big);font-size:1rem;letter-spacing:.06em;padding:5px 12px 3px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brass);color:var(--brass-ink)}
.hist{margin-top:10px;font-size:.88rem}.hist summary{cursor:pointer;color:var(--brass);font-family:var(--type)}.hist p{margin:6px 0 0;color:var(--muted)}
.login{max-width:380px;margin:28px auto 60px;display:grid;gap:10px;background:var(--surface);border:1px solid var(--brass);padding:24px;position:relative}
.login label{margin:0;font-family:var(--type);color:var(--ink)}
.login input{font:inherit;font-size:1.1rem;padding:12px;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:0}
.login .btn{font-size:1.15rem;padding:10px}
.login-langs{display:flex;justify-content:center;margin-top:4px}
.cl-opts{margin-top:14px}
.cl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.cl-pick{display:grid;gap:6px;text-align:left;font:inherit;padding:16px;background:var(--surface);border:1px solid var(--brass);color:var(--ink);cursor:pointer}
.cl-pick b{font-family:var(--big);font-weight:400;font-size:1.35rem;letter-spacing:.05em}
.cl-pick span{font-family:var(--type);font-size:.8rem;color:var(--muted)}
.cl-pick:hover{background:var(--bg)}
.cl-head{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.cl-form h2{margin-top:14px;font-family:var(--big);font-weight:400;letter-spacing:.06em;color:var(--red);font-size:clamp(1.7rem,6vw,2.3rem)}
.cl-intro{color:var(--muted);font-style:italic;margin:-6px 0 10px}
.cl-progress{font-family:var(--type);color:var(--brass);margin:0 0 8px}
.cl-items{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.cl-items li label{display:flex;gap:12px;align-items:flex-start;margin:0;padding:12px 14px;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-size:1rem;cursor:pointer}
.cl-items input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--brass)}
.cl-items li label:has(input:checked){border-color:var(--brass)}
.cl-items li label:has(input:checked) span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--brass)}
.cl-items small{display:block;margin-top:3px;font-family:var(--type);font-size:.78rem;color:var(--muted);text-decoration:none}
.cl-h h3{font-family:var(--big);font-weight:400;font-size:1.2rem;letter-spacing:.06em;color:var(--red);margin:14px 0 2px}
.cl-sign{margin-top:16px;background:var(--surface);border-color:var(--brass)}
.cl-sign label{color:var(--ink)}
.cl-sign select{display:block;width:100%;margin-top:4px;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.banner{margin:16px 0 0;padding:12px 14px;border:1px solid var(--brass);background:var(--surface);color:var(--ink);font-family:var(--type)}
textarea.tall{min-height:280px;font-family:var(--type);font-size:.85rem}
.m-list{overflow-x:auto}
.m-table{max-width:none;width:100%;border-collapse:collapse;font-size:.88rem}
.m-table th{text-align:left;font-family:var(--type);font-weight:400;color:var(--muted);border-bottom:1px solid var(--line);padding:6px 10px 6px 0;white-space:nowrap}
.m-table td{text-align:left;color:var(--ink);font-weight:400;white-space:normal;padding:8px 10px 8px 0;border-bottom:1px dashed var(--line);vertical-align:top}
.m-table td.ok{color:var(--brass);font-weight:600}.m-table td.warn{color:var(--red);font-weight:600}
.m-table small{color:var(--muted)}
.m-form{background:var(--surface);border:1px solid var(--line);padding:16px;margin:12px 0}
.m-form h3{font-family:var(--big);font-weight:400;letter-spacing:.06em;margin:0 0 10px}
.m-form textarea{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);padding:9px 10px;min-height:90px}
.m-form label.inline{display:flex;gap:8px;align-items:center;color:var(--ink)}
#view-manage h2,#view-checklists > h2{font-family:var(--big);font-weight:400;letter-spacing:.07em;color:var(--red);font-size:1.7rem;margin:26px 0 8px}
@media (max-width:540px){ .tabs{align-items:flex-start} .who{width:100%;justify-content:space-between} .row{grid-template-columns:1fr} }
</style>

<body>
<div id="root"></div>

let uid = 0;

function findPrep(d, name){
  const k = String(name).toLowerCase().trim(), scope = d.scope||"";

    if (d.bought && !r.scope && !r.blend) continue;
    if ((r.scope||"")===scope) return r;
    if (!best && !r.scope) best = r;

}

function parseQty(str){ const t = String(str).trim(); let m;
  if ((m = t.match(/^(\d+)\s+(\d+)\/(\d+)/))) return { n: +m[1] + m[2]/m[3], rest: t.slice(m[0].length) };
  if ((m = t.match(/^(\d+)\/(\d+)/))) return { n: m[1]/m[2], rest: t.slice(m[0].length) };
  if ((m = t.match(/^(\d*\.?\d+)/))) return { n: parseFloat(m[1]), rest: t.slice(m[0].length) };
  return null; }

const fmt = v => { const t = String(v==null?"":v).trim(); const q = parseQty(t);
  if (q && /^[0-9.\/ ]+$/.test(t)) { const oz = q.n * batch;
    if (units === "ml") { const ml = Math.round(oz*30*2)/2; return ml >= 1000 ? nice(ml/1000)+" L" : nice(ml)+" ml"; }
    return nice(oz)+" oz"; }
  if (q && batch > 1) return nice(q.n*batch) + q.rest;

const sectionOf = d => SECTIONS.includes(d.section) ? d.section : "Seasonal";

  const q = query.trim().toLowerCase();

let currentView = "recipes";
function mountApp(view){
canEdit = session.role === "editor";
recipes = content.recipes || [];
root.innerHTML = `<div class="wrap">
  <header>${H1}<p class="lede">${t("lede")}</p></header>
  <nav class="tabs" aria-label="${t("sectionsNav")}">
    <div class="tab-row">
      <button type="button" class="tab" data-view="recipes">${t("recipes")}</button>
      <button type="button" class="tab" data-view="checklists">${t("checklists")}</button>
      ${canEdit?`<button type="button" class="tab" data-view="manage">${t("manage")}</button>`:""}
    </div>
    <div class="who">${langSwitch()}<span class="who-name">${esc(session.name)}</span><button type="button" class="linkish" id="logout">${t("logout")}</button></div>
  </nav>
  <section id="view-recipes">
  <div class="tools">
    <input class="search" id="q" type="search" placeholder="${attr(t("search"))}" aria-label="${attr(t("search"))}">
    <div class="chips" id="chips" role="group" aria-label="${attr(t("showSection"))}"></div>
    <button class="btn" id="add" ${canEdit?"":"hidden"}>${t("addRecipe")}</button>
  </div>
  <div class="opts">
    <label>${t("venue")} <select id="venue-sel">${venueOptions(venueSel, t("allVenues"))}</select></label>
    <div class="seg" role="group" aria-label="${attr(t("units"))}"><button type="button" data-u="oz" aria-pressed="${units==="oz"}">oz</button><button type="button" data-u="ml" aria-pressed="${units==="ml"}">ml</button></div>
    <label class="batch">${t("make")} <input id="batch" type="number" min="1" max="500" step="1" value="${batch}" inputmode="numeric"> ${t("drinksX")}</label>
  </div>
  <p class="status" id="status" role="status"></p>
  <nav class="barline" aria-label="${attr(t("jump"))}"><ol id="barline"></ol></nav>
  <div id="list"></div>
  <footer>${t("footer")}</footer>
  </section>
  <section id="view-checklists" hidden></section>
  <section id="view-manage" hidden></section>
</div>
<dialog id="dlg" aria-labelledby="ed-title"><form class="ed" id="ed" method="dialog"></form></dialog>`;
document.documentElement.lang = lang;
root.querySelector(".tab-row").addEventListener("click", e => { const b = e.target.closest(".tab"); if (b) showView(b.dataset.view); });
$("logout").addEventListener("click", async () => { await api("POST", "/api/logout"); session = null; content = null; showLogin(); });
root.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => { lang = b.dataset.lang; store.set("lang", lang); mountApp(currentView); }));
$("venue-sel").addEventListener("change", e => { venueSel = e.target.value; store.set("venue", venueSel); render(); });
root.querySelector(".seg").addEventListener("click", e => { const b = e.target.closest("[data-u]"); if (!b) return; units = b.dataset.u; store.set("units", units);
  root.querySelectorAll(".seg [data-u]").forEach(x => x.setAttribute("aria-pressed", x.dataset.u===units)); render(); });
$("batch").addEventListener("input", e => { const n = Math.round(+e.target.value); batch = n >= 1 && n <= 500 ? n : 1; render(); });

function setStatus(t){ $("status").textContent = t||""; }
$("chips").innerHTML = ["All",...SECTIONS].map(s=>`<button type="button" class="chip" data-s="${attr(s)}" aria-pressed="${s===filter}">${esc(secName(s))}</button>`).join("");
$("chips").addEventListener("click", e => { const b=e.target.closest(".chip"); if(!b) return; filter=b.dataset.s;
  document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed", c.dataset.s===filter)); render(); });
$("title").addEventListener("click", () => {
  eggTaps++; clearTimeout(eggTimer); eggTimer = setTimeout(()=>{ eggTaps = 0; }, 2000);
  if (eggTaps >= 5) { eggTaps = 0; }
});
$("q").addEventListener("input", e => { query = e.target.value; render(); });

function card(d){
  if (d.kind==="prep") return prepCard(d);
  if (d.kind==="lesson") return lessonCard(d);
  const fig = d.photoId ? `<img src="/_blob/${attr(d.photoId)}" alt="${attr(d.name)}" data-for="${attr(d.id)}">` : drawGlass(d);
  return `<article class="drink" id="${attr(d.id)}"><figure>${fig}</figure><div>
    <h3>${esc(d.name)}</h3>${d.aka?`<p class="aka">${esc(d.aka)}</p>`:""}
    ${d.look?`<p class="look">${esc(d.look)}</p>`:""}
    <table>${(d.specs||[]).map(([i,v])=>{ const pr = findPrep(d, i); return `<tr><td>${pr?`<a class="prep-link" href="#${attr(pr.id)}">${esc(i)}</a>`:esc(i)}</td><td>${esc(fmt(v))}</td></tr>`; }).join("")}</table>
    <dl>${d.method?`<dt>${t("method")}</dt><dd>${esc(d.method)}</dd>`:""}<dt>${t("glass")}</dt><dd>${esc(d.glassName||GLASS_LABEL[d.glass]||"")}</dd>${d.garnishName?`<dt>${t("garnish")}</dt><dd>${esc(d.garnishName)}</dd>`:""}</dl>
    ${d.note?`<p class="note">${esc(d.note)}</p>`:""}${d.history?`<details class="hist"><summary>${t("history")}</summary><p>${esc(d.history)}</p></details>`:""}</div>
    ${canEdit?`<button type="button" class="edit" data-edit="${attr(d.id)}" aria-label="Edit ${attr(d.name)}">${t("edit")}</button>`:""}</article>`;
}
function drinkLink(name){
  const k = String(name).toLowerCase().trim();
  const r = sorted().find(x=>!x.kind && !x.easter && String(x.name).toLowerCase().trim()===k);
  return r ? `<a href="#${attr(r.id)}">${esc(name)}</a>` : esc(name);
}
function lessonCard(d){
  const b = (d.blocks||[]).map(x=>{
    if (x.h) return `<h4>${esc(x.h)}</h4>`;
    if (x.p) return `<p>${esc(x.p)}</p>`;
    if (x.tip) return `<p class="tip">${esc(x.tip)}</p>`;
    if (x.steps) return `<ol class="steps">${x.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>`;
    if (x.table) return `<div class="tw"><table class="lt"><thead><tr>${x.table.head.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${x.table.rows.map(r=>`<tr>${r.map((c,i)=>`<td>${i===0?drinkLink(c):esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    return "";
  }).join("");
  return `<article class="lesson" id="${attr(d.id)}"><h3>${esc(d.name)}</h3>${d.intro?`<p class="lesson-intro">${esc(d.intro)}</p>`:""}${b}</article>`;
}
function prepCard(d){
  const uses = usedIn(d), guide = d.guide || d.id==="prep-50-brix";
  const ing = (d.specs||[]).map(([i,v])=> guide ? `<li><b>${esc(i)}:</b> ${esc(v)}</li>` : `<li><span class="q">${esc(v)}</span> ${esc(i)}</li>`).join("");
  const meta = (d.yield?`Makes ${esc(d.yield)}.`:"") + (uses.length?` Used in ${uses.map(u=>`<a href="#${attr(u.id)}">${esc(u.name)}</a>`).join(", ")}.`:"");
  return `<article class="prep${guide?" guide":""}" id="${attr(d.id)}">
    <div class="prep-head"><span class="dot" style="background:${hex(d.color&&d.color[0],"#DDDDDD")}"></span><h3>${esc(d.name)}</h3>${guide?"":`<span class="bx">${esc(d.label || (String(d.brix||50)+" Brix"))}</span>`}</div>
    ${guide&&d.look?`<p class="prep-look">${esc(d.look)}</p>`:""}
    <ul class="prep-ing">${ing}</ul>
    ${d.method?((guide||d.method.includes("\n"))?`<ol class="steps">${d.method.split("\n").filter(Boolean).map(s=>`<li>${esc(s)}</li>`).join("")}</ol>`:`<p class="prep-how">${esc(d.method)}</p>`):""}
    ${guide&&d.why?`<p class="prep-how"><b>Why heat first:</b> ${esc(d.why)}</p>`:""}
    ${d.note?`<p class="prep-note">${esc(d.note)}</p>`:""}
    ${meta?`<p class="prep-meta">${meta}</p>`:""}
    ${canEdit?`<button type="button" class="edit" data-edit="${attr(d.id)}" aria-label="Edit ${attr(d.name)}">Edit</button>`:""}</article>`;
}
$("list").addEventListener("error", e => { const im = e.target; if (im.tagName==="IMG" && im.dataset.for) im.outerHTML = drawGlass(recipes.find(r=>r.id===im.dataset.for)||{}); }, true);

function render(){
  const list = visible();
  const bl = list.filter(d=>!d.kind); $("barline").parentElement.hidden = !bl.length;
  $("barline").innerHTML = bl.map(d=>`<li><a href="#${attr(d.id)}">${drawGlass(d)}<span>${esc(d.name)}</span></a></li>`).join("");
  let html = "";
  const eq = query.trim().toLowerCase();
  const norm = t => String(t).toLowerCase().replace(/[’'‘`]/g,"").replace(/\s+/g," ").trim();
  const egg = recipes.filter(d=>d.easter && eq && norm(d.name)===norm(eq));
  if (egg.length) html += `<h2>${t("found")} 🥚</h2>` + egg.map(card).join("");
  for (const s of SECTIONS){ const items = list.filter(d=>sectionOf(d)===s); if (!items.length) continue;
    html += `<h2>${esc(secName(s))}</h2>`; let last = null;
    for (const d of items){ if (d.menu && d.menu!==last){ html += `<h3 class="menu-head">${esc(d.menu)}</h3>`; last = d.menu; } html += card(d); } }
  $("list").innerHTML = html || `<p class="empty">${recipes.length? t("noMatch") : t("noRecipes")}</p>`;
}
$("list").addEventListener("click", e => { const b = e.target.closest("[data-edit]"); if (b) openEditor(recipes.find(r=>r.id===b.dataset.edit)); });
render();

/* ---------- editor ---------- */
const opts = (map, cur) => Object.entries(map).map(([k,v])=>`<option value="${k}"${k===(cur||"")?" selected":""}>${esc(v)}</option>`).join("");
let editing = null, pendingPhoto = null, deleteArmed = false;
function ingRow(i="",v=""){ return `<div class="ing"><input aria-label="Ingredient" placeholder="Ingredient" value="${attr(i)}"><input aria-label="Amount" placeholder="oz or note" value="${attr(v)}"><button type="button" class="x" data-rm aria-label="Remove ingredient">×</button></div>`; }
function openEditor(d){
  editing = d || null; pendingPhoto = null; deleteArmed = false;
  d = d || {section:filter==="All"?"Karaoke signatures":filter, glass:"coupe", ice:"none", color:["#F2C48A","#C9772E"], garnish:[], specs:[["",""],["",""],["",""]]};
  const f = $("ed");
  f.innerHTML = `<div class="ed-head"><h2 id="ed-title">${editing?"Edit recipe":"Add a recipe"}</h2><button type="button" class="btn ghost" data-close>Cancel</button></div>
  <div class="ed-preview"><div id="pv"></div><p>The drawing updates as you fill in the glass, colour, ice and garnish.</p></div>
  ${sampleApi?`<fieldset><legend>Fill in from text</legend><p class="hint">Paste a spec as you’d write it, and Claude fills in the form, including the drawing. Check it before saving.</p>
    <label>Recipe text<textarea id="f-paste" placeholder="e.g. Negroni – 1 gin, 1 Campari, 1 sweet vermouth, stir, rocks, orange peel"></textarea></label>
    <button type="button" class="btn ghost" id="f-fill">Fill in the form</button> <span class="hint" id="f-fillmsg"></span></fieldset>`:""}
  <fieldset><legend>Recipe</legend>
    <label>Name<input id="f-name" required value="${attr(d.name||"")}"></label>
    <div class="row"><label>Section<select id="f-section">${opts(Object.fromEntries(SECTIONS.map(s=>[s,s])), sectionOf(d))}</select></label>

async function fillFromText(){
  const text = ($("f-paste").value||"").trim(), msg = $("f-fillmsg");
  if (!text) { msg.textContent = "Paste a recipe first."; return; }
  msg.textContent = "Working it out…"; $("f-fill").disabled = true;
  const prompt = `You turn a bartender's cocktail spec into structured data for a recipe card app.
Return ONLY a JSON object with these keys:
"name" (string), "aka" (string or ""), "specs" (array of [ingredient, amount] pairs; amounts in ounces as plain numbers like "1.5", or words like "2 dashes", "Top", "Rim", "Float"), "method" (short, e.g. "Shake", "Stir", "Build"), "glassName" (as a bartender would write it), "garnishName" (string or ""), "look" (one sentence: colour, clarity, fizz, garnish, as the finished drink should look), "note" (batching or syrup notes from the text, else ""),
"glass" (one of "coupe","nick","martini","wine","flute","collins","rocks"), "ice" (one of "none","cubes","big","dirty"), "garnish" (one of "","lemonWedge","limeWedge","orangeWedge","lemonSwath","orangeSwath","mint","olive","cherry","flower"), "rim" (one of "","sugar","salt","halfSalt"), "color" ([top hex, bottom hex] for the liquid, realistic for these ingredients, top slightly lighter), "bubbles" (true if topped with anything sparkling), "cloudy" (true if opaque or hazy, e.g. dairy, coconut, egg, lots of citrus), "foam" (true if it has egg white or whole egg), "float" (true if bitters or a dark spirit is floated on top).
Keep the bartender's measures and wording; fix obvious spelling.
Recipe:
${text}`;
  try {
    const r = await sampleApi.json(prompt);
    const set = (id,val) => { if ($(id) && val!=null) $(id).value = val; };
    set("f-name", r.name); set("f-aka", r.aka); set("f-method", r.method); set("f-glassName", r.glassName);
    set("f-garnishName", r.garnishName); set("f-look", r.look); set("f-note", r.note);
    if (glasses[r.glass]) set("f-glass", r.glass);
    if (["none","cubes","big","dirty"].includes(r.ice)) set("f-ice", r.ice);
    if (r.garnish in GARNISH_LABEL) set("f-garnish", r.garnish);
    if (["","sugar","salt","halfSalt"].includes(r.rim)) set("f-rim", r.rim);
    if (Array.isArray(r.color)) { set("f-c0", hex(r.color[0],"#F2C48A")); set("f-c1", hex(r.color[1],"#C9772E")); }
    $("f-bubbles").checked = !!r.bubbles; $("f-cloudy").checked = !!r.cloudy; $("f-float").checked = !!r.float; $("f-foam").checked = !!r.foam;
    if (Array.isArray(r.specs) && r.specs.length) $("f-ings").innerHTML = r.specs.map(p=>ingRow(String(p[0]||""),String(p[1]||""))).join("");
    preview(); msg.textContent = "Filled in. Check it, then save.";
  } catch(err) {
    msg.textContent = err && err.code==="not_granted" ? "Filling in from text is turned off here." : err && err.code==="rate_limited" ? "Too many requests just now. Try again in a minute." : "Couldn’t read that. Try again or fill it in by hand.";
  } finally { $("f-fill").disabled = false; }
}

/* ---------- saving: editors write to the private store ---------- */
async function save(list, label){
  const st = $("f-status"); st.textContent = label;
  const r = await api("PUT", "/api/content/recipes", { data: list, base: (content.versions||{}).recipes });
  const sb = $("f-save"); if (sb) sb.disabled = false;
  if (r.ok) { content = r.body.content; recipes = content.recipes; $("dlg").close(); render(); setStatus(t("saved")); }
  else if (r.status === 409) { content = r.body.content; recipes = content.recipes; render(); st.textContent = t("conflict"); }
  else if (r.status !== 401) st.textContent = t("saveFail");
}

async function api(method, url, body){
  let r;
  try { r = await fetch(url, { method, credentials: "same-origin", headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined }); }
  catch(e) { return { ok: false, status: 0, body: {} }; }
  let j = {}; try { j = await r.json(); } catch(e) {}
  if (r.status === 401 && url !== "/api/login" && session) { session = null; showLogin(t("expired")); }
  return { ok: r.ok, status: r.status, body: j };
}

  root.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => { lang = b.dataset.lang; store.set("lang", lang); showLogin(); }));

  let v = "recipes"; try { v = sessionStorage.getItem("vn.view") || "recipes"; } catch(e) {}

  v.querySelector(".cl-items").addEventListener("change", e => { const i = +e.target.dataset.i; if (e.target.checked) clChecked.add(i); else clChecked.delete(i); prog(); });
  $("cl-notes").addEventListener("input", e => { clDraft.notes = e.target.value; });
  $("cl-name").addEventListener("input", e => { clDraft.name = e.target.value; });
  $("cl-v").addEventListener("change", e => { clDraft.venue = e.target.value; });
  $("cl-back").addEventListener("click", () => { openChecklist = null; renderChecklists(); });
  if (canEdit) $("cl-edit").addEventListener("click", () => openChecklistEditor(c));
  $("cl-form").addEventListener("submit", async e => {
    e.preventDefault(); const st = $("cl-status");
    const venue = $("cl-v").value, name = $("cl-name").value.trim();
    if (!venue) { st.textContent = t("needVenue"); $("cl-v").focus(); return; }
    if (!name) { st.textContent = t("needName"); $("cl-name").focus(); return; }
    const btn = $("cl-send"); btn.disabled = true; st.textContent = t("sending");
    if (session.shared) store.set("signName", name);
    const r = await api("POST", "/api/submissions", { checklistId: c.id, venue, name, notes: $("cl-notes").value, checked: [...clChecked] });
    btn.disabled = false;
    if (r.ok) { openChecklist = null; clChecked = new Set(); renderChecklists(); setTimeout(() => { const v2 = $("view-checklists"); if (v2) v2.insertAdjacentHTML("afterbegin", `<p class="banner" role="status">${esc(r.body.emailed ? t("sent") : t("sentNoEmail"))}</p>`); }, 0); }
    else if (r.status !== 401) st.textContent = t("sendFail");
  });
}

/* checklist editor (editors only). One task per line: English | Spanish | who. A line starting with ## is a heading. */
function openChecklistEditor(c){
  const isNew = !c;
  c = c || { id: "", title: { en: "", es: "" }, intro: { en: "", es: "" }, venues: [], roles: [], items: [] };
  const lines = (c.items||[]).map(i => (i.h ? "## " : "") + [i.en||"", i.es||"", i.h ? "" : (i.who||"")].join(" | ").replace(/( \| )+$/, "")).join("\n");
  const f = $("ed"); let armed = false;
  f.innerHTML = `<div class="ed-head"><h2 id="ed-title">${isNew?"New checklist":"Edit checklist"}</h2><button type="button" class="btn ghost" data-close>Cancel</button></div>
  <fieldset><legend>Checklist</legend>
    <div class="row"><label>Title (English)<input id="c-ten" required value="${attr(c.title.en||"")}"></label><label>Title (Spanish)<input id="c-tes" value="${attr(c.title.es||"")}"></label></div>
    <div class="row"><label>Intro (English)<input id="c-ien" value="${attr((c.intro&&c.intro.en)||"")}"></label><label>Intro (Spanish)<input id="c-ies" value="${attr((c.intro&&c.intro.es)||"")}"></label></div>
    <p class="hint">Venues (leave all unticked for every venue)</p>
    <div class="checks" id="c-venues">${(content.venues||[]).map(v=>`<label><input type="checkbox" value="${attr(v.id)}"${(c.venues||[]).includes(v.id)?" checked":""}> ${esc(v.name)}</label>`).join("")}</div>
    <p class="hint">Roles (leave all unticked for every role)</p>
    <div class="checks" id="c-roles">${(content.roles||[]).map(r=>`<label><input type="checkbox" value="${attr(r.id)}"${(c.roles||[]).includes(r.id)?" checked":""}> ${esc(r.en)}</label>`).join("")}</div>
  </fieldset>
  <fieldset><legend>Tasks</legend>
    <p class="hint">One task per line: <b>English | Spanish | who does it</b>. Spanish and who are optional. Start a line with <b>##</b> to make a heading.</p>
    <textarea id="c-items" class="tall">${esc(lines)}</textarea>
  </fieldset>
  <div class="ed-actions"><div>${isNew?"":`<button type="button" class="btn danger" id="c-del">Delete checklist</button>`}</div>
  <div><button type="button" class="btn ghost" data-close>Cancel</button><button type="button" class="btn" id="c-save">Save</button></div></div>
  <p class="status" id="c-status" role="status"></p>`;
  $("dlg").showModal();
  const close = () => $("dlg").close();
  f.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", close, { once: true }));
  const persist = async (list) => {
    const r = await api("PUT", "/api/content/checklists", { data: list, base: (content.versions||{}).checklists });
    if (r.ok) { content = r.body.content; close(); renderChecklists(); return; }
    if (r.status === 409) { content = r.body.content; $("c-status").textContent = t("conflict"); renderChecklists(); return; }
    if (r.status !== 401) $("c-status").textContent = t("saveFail");
  };
  if (!isNew) $("c-del").addEventListener("click", e => {
    if (!armed) { armed = true; e.target.textContent = "Tap again to delete"; return; }
    openChecklist = null; persist((content.checklists||[]).filter(x => x.id !== c.id));
  });
  $("c-save").addEventListener("click", () => {
    const en = $("c-ten").value.trim(); if (!en) { $("c-status").textContent = "Give the checklist a title."; return; }
    const items = $("c-items").value.split("\n").map(l => l.trim()).filter(Boolean).map(l => {
      const h = l.startsWith("##"); const parts = l.replace(/^##\s*/, "").split("|").map(x => x.trim());
      return h ? { h: true, en: parts[0], es: parts[1]||"" } : { en: parts[0], es: parts[1]||"", who: parts[2]||"" };
    });
    const next = { ...c, title: { en, es: $("c-tes").value.trim() }, intro: { en: $("c-ien").value.trim(), es: $("c-ies").value.trim() },
      venues: [...document.querySelectorAll("#c-venues input:checked")].map(x=>x.value), roles: [...document.querySelectorAll("#c-roles input:checked")].map(x=>x.value), items };
    if (isNew) next.id = (en.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "checklist") + "-" + Math.random().toString(36).slice(2,6);
    const list = isNew ? [...(content.checklists||[]), next] : (content.checklists||[]).map(x => x.id === c.id ? next : x);
    persist(list);
  });
}

/* ---------- manage (editors only) ---------- */
async function renderManage(){
  const v = $("view-manage"); if (!v || !canEdit) return;
  v.innerHTML = `<h2>Passwords</h2>
  <p class="hint">Staff log in with a password only. Use one <b>main staff password</b> for everyone, and add <b>personal passwords</b> when you want a person's name on their sign-offs automatically. Deleting a password logs that person out right away.</p>
  <div id="pw-list" class="m-list"><p class="hint">Loading…</p></div>
  <form class="m-form" id="pw-form">
    <h3>Add a password</h3>
    <div class="row"><label>Name<input id="pw-name" required maxlength="60" placeholder="e.g. Staff — main, or Maria G."></label>
    <label>Password<input id="pw-new" required minlength="6" autocomplete="new-password"></label></div>
    <div class="row"><label>Access<select id="pw-role"><option value="staff">Staff — view and sign off</option><option value="editor">Editor — can change everything</option></select></label>
    <label class="inline"><input type="checkbox" id="pw-shared"> Main shared password (people type their name when signing off)</label></div>
    <div><button type="button" class="btn ghost" id="pw-gen">Make one up for me</button> <button class="btn">Add password</button></div>
    <p class="status" id="pw-status" role="status"></p>
  </form>
  <h2>Manager emails</h2>
  <p class="hint">Every checklist sign-off is emailed to these addresses. One per line.</p>
  <form class="m-form" id="em-form"><textarea id="em-list">${esc(((content.settings||{}).managerEmails||[]).join("\n"))}</textarea>
  <div><button class="btn">Save emails</button></div><p class="status" id="em-status" role="status"></p></form>
  <h2>Recent sign-offs</h2><div id="subs" class="m-list"><p class="hint">Loading…</p></div>`;

  const loadPw = async () => {
    const r = await api("GET", "/api/passwords"); if (!r.ok) { $("pw-list").innerHTML = `<p class="hint">${t("netErr")}</p>`; return; }
    const ps = r.body.passwords || [];
    $("pw-list").innerHTML = `<table class="m-table"><thead><tr><th>Name</th><th>Access</th><th>Added</th><th></th></tr></thead><tbody>
      <tr><td>${esc(session.owner ? session.name + " (you)" : "Owner")} <small>(set in Netlify)</small></td><td>Editor</td><td>—</td><td></td></tr>
      ${ps.map(p=>`<tr><td>${esc(p.name)}${p.shared?" <small>(main shared)</small>":""}</td><td>${p.role==="editor"?"Editor":"Staff"}</td><td>${esc((p.createdAt||"").slice(0,10))}${p.createdBy?` <small>by ${esc(p.createdBy)}</small>`:""}</td>
      <td><button type="button" class="linkish danger-text" data-del="${attr(p.id)}">Delete</button></td></tr>`).join("")}</tbody></table>`;
  };
  $("pw-list").addEventListener("click", async e => {
    const b = e.target.closest("[data-del]"); if (!b) return;
    if (b.dataset.armed !== "1") { b.dataset.armed = "1"; b.textContent = "Tap again to delete"; return; }
    const r = await api("DELETE", "/api/passwords/" + encodeURIComponent(b.dataset.del));
    if (r.ok) loadPw(); else if (r.status !== 401) $("pw-status").textContent = "That didn’t delete. Try again.";
  });
  $("pw-gen").addEventListener("click", () => {
    const words = ["neon","velvet","jazz","martini","coupe","shaker","bitters","cherry","lounge","encore","rye","gin","tonic","swing","stardust","rouge","lair","bourbon","cobbler","fizz"];
    const pick = () => words[crypto.getRandomValues(new Uint32Array(1))[0] % words.length];
    $("pw-new").value = `${pick()}-${pick()}-${crypto.getRandomValues(new Uint32Array(1))[0] % 90 + 10}`;
  });
  $("pw-form").addEventListener("submit", async e => {
    e.preventDefault(); const st = $("pw-status");
    const r = await api("POST", "/api/passwords", { name: $("pw-name").value, password: $("pw-new").value, role: $("pw-role").value, shared: $("pw-shared").checked });
    if (r.ok) { st.textContent = `Added. Give “${$("pw-new").value}” to ${$("pw-name").value}.`; $("pw-form").reset(); loadPw(); }
    else st.textContent = r.body.error === "password_in_use" ? "That password is already used. Pick another." : r.body.error === "password_too_short" ? "Use at least 6 characters." : "That didn’t save. Try again.";
  });
  $("em-form").addEventListener("submit", async e => {
    e.preventDefault();
    const emails = $("em-list").value.split(/[\s,;]+/).map(x=>x.trim()).filter(Boolean);
    const bad = emails.filter(x => !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x));
    if (bad.length) { $("em-status").textContent = "Check these: " + bad.join(", "); return; }
    const r = await api("PUT", "/api/content/settings", { data: { ...(content.settings||{}), managerEmails: emails }, base: (content.versions||{}).settings });
    if (r.ok) { content = r.body.content; $("em-status").textContent = "Saved."; } else if (r.status !== 401) $("em-status").textContent = r.status === 409 ? t("conflict") : t("saveFail");
  });
  loadPw();
  const s = await api("GET", "/api/submissions");
  if (!s.ok) { $("subs").innerHTML = `<p class="hint">${t("netErr")}</p>`; return; }
  const subs = s.body.submissions || [];
  $("subs").innerHTML = subs.length ? `<table class="m-table"><thead><tr><th>When</th><th>Venue</th><th>Checklist</th><th>Signed by</th><th>Done</th><th>Notes</th></tr></thead><tbody>${subs.map(x=>`<tr>
    <td>${esc(new Date(x.at).toLocaleString([], { month:"short", day:"numeric", hour:"numeric", minute:"2-digit" }))}</td><td>${esc(venueName(x.venue))}</td><td>${esc(x.checklist||"")}</td>
    <td>${esc(x.name)}${x.name!==x.signedInAs?` <small>(${esc(x.signedInAs)})</small>`:""}</td>
    <td class="${x.done===x.total?"ok":"warn"}">${x.done}/${x.total}${x.missed&&x.missed.length?`<details><summary>Not done</summary><ul>${x.missed.map(m=>`<li>${esc(m)}</li>`).join("")}</ul></details>`:""}</td>
    <td>${esc(x.notes||"")}</td></tr>`).join("")}</tbody></table>` : `<p class="hint">No sign-offs yet.</p>`;
}

boot();

})();
</script>
</body>
